name: Prévia empresas serviços — auditoria visual
on:
  push:
    branches: [preview-empresas-servicos-v1-20261028]
    paths:
      - 'previews/empresas-servicos-v1/**'
      - '.github/workflows/visual-empresas-servicos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verificar fotos, logos, mobile e desktop
        run: node previews/empresas-servicos-v1/visual-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagens-e-relatorio-empresas-servicos
          path: visual-empresas-servicos/
          retention-days: 14
          if-no-files-found: warn
