<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>iGreen APN · Estudo de cor amarelo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:system-ui,-apple-system,sans-serif}
#source{width:100%;height:100%;display:block;border:0;filter:hue-rotate(-41deg);transform:translateZ(0)}
#source.original{filter:none}
.tools{position:fixed;right:12px;bottom:12px;z-index:10;background:rgba(0,0,0,.93);color:white;border:1px solid #F1FF00;border-radius:12px;padding:10px 12px;max-width:300px;font-size:12px;box-shadow:0 2px 30px #0009}
.tools strong{font-size:12px}.tools small{display:block;color:#999;font-size:10px;margin:6px 0 0;line-height:1.4}.buttons{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
button,a.button{font:inherit;border:1px solid #F1FF00;color:#F1FF00;background:transparent;padding:7px 9px;border-radius:7px;cursor:pointer;text-decoration:none}
button.active{background:#F1FF00;color:black;font-weight:700}
#help{display:none}
@media(max-width:580px){.tools{right:7px;bottom:7px;left:7px;max-width:none;padding:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.tools strong{font-size:10px}.tools small{display:none}.buttons{margin:0;flex-wrap:nowrap}button,a.button{font-size:10px;white-space:nowrap;padding:7px}}
</style>
</head>
<body>
<iframe id="source" title="Apresentação oficial iGreen em estudo de filtro amarelo" src="https://apn.igreenenergy.com.br/" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div class="tools">
<div><strong>ESTUDO DE COR · iGreen original</strong><small>A página é carregada diretamente da iGreen; filtro de cor ilustrativo, sem cópia do site. Caso o conteúdo não abra, a iGreen pode bloquear exibição em outros sites.</small></div>
<div class="buttons">
<button class="active" id="yellow" aria-pressed="true">Amarelo</button>
<button id="original" aria-pressed="false">Original</button>
<a class="button" href="https://apn.igreenenergy.com.br/" target="_blank" rel="noopener noreferrer">Abrir iGreen ↗</a>
</div></div>
<script>
const f=document.getElementById('source'),y=document.getElementById('yellow'),o=document.getElementById('original');
function set(original){f.classList.toggle('original',original);o.classList.toggle('active',original);y.classList.toggle('active',!original);o.setAttribute('aria-pressed',String(original));y.setAttribute('aria-pressed',String(!original))}
y.addEventListener('click',()=>set(false));o.addEventListener('click',()=>set(true));
</script></body></html>
